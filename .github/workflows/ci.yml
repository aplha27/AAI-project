name: eKYC Autonomous Agent CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python tests/test_full_suite.py

      - name: Run Q-Learning RL Policy Simulation
        run: |
          python -c "from backend.agent.rl_policy import QLearningDecisionPolicy; import json; p = QLearningDecisionPolicy(); p.train_on_manifest(json.load(open('backend/data/processed/bundles_manifest.json')), episodes=100)"

      - name: Run Benchmark Evaluation
        run: |
          python backend/evaluation/evaluate.py

